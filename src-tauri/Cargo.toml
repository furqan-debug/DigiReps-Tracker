[package]
name = "digireps-tracker"
version = "2.0.57"
description = "DigiReps Time Tracker — Desktop App"
authors = ["DigiReps"]
edition = "2021"

[lib]
name = "tauri_scaffold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Build with `--features app-store` for the Mac App Store target.
# This removes the self-updater and accessibility-gated window-title
# tracking, which are both disallowed or unnecessary in the MAS sandbox.
app-store = []

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
screenshots = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = "0.24"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
ureq = { version = "2", features = ["native-tls", "json"] }
active-win-pos-rs = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
